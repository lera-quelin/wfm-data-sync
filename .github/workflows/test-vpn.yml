name: Connexion VPN avec Selenium

on:
  workflow_dispatch: # Lancement manuel

jobs:
  test-vpn:
    runs-on: ubuntu-latest
    steps:
      # 1. On récupère le code de votre dépôt (pour avoir accès à vpn_login.py)
      - name: Récupérer le code
        uses: actions/checkout@v4

      # 2. On installe Python sur le serveur GitHub
      - name: Configuration Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      # 3. On installe Selenium, OpenConnect et les pré-requis
      - name: Installer les dépendances
        run: |
          sudo apt-get update
          sudo apt-get install -y openconnect
          pip install selenium webdriver-manager

      # 4. On lance votre script Python !
      - name: Exécuter le script de connexion Selenium
        env:
          VPN_USER: ${{ secrets.VPN_USERNAME }}
          VPN_PASS: ${{ secrets.VPN_PASSWORD }}
        run: |
          python vpn_login.py
