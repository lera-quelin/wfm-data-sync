name: Test Connexion VPN Webhelp

on:
  workflow_dispatch: # Permet de lancer le script manuellement

jobs:
  test-vpn:
    runs-on: ubuntu-latest
    steps:
      - name: Installer OpenConnect
        run: sudo apt-get update && sudo apt-get install -y openconnect

      - name: Tester l'authentification VPN
        env:
          VPN_USER: ${{ secrets.VPN_USER }}
          VPN_PASS: ${{ secrets.VPN_PASS }}
          VPN_GROUP: ${{ secrets.VPN_GROUP }}
        run: |
          echo "Tentative de connexion au VPN avec le groupe $VPN_GROUP..."
          # On utilise --authenticate pour juste tester le login sans monter le tunnel
          echo -e "${VPN_PASS}\n${VPN_PASS}" | openconnect --authenticate --protocol=anyconnect --user="${VPN_USER}" --authgroup="${VPN_GROUP}" vpn.webhelp.fr --passwd-on-stdin
