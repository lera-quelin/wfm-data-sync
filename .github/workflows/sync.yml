name: WFM Sync & Keep Alive

on:
  push:
    branches:
      - main
  schedule:
    # Toutes les 5 minutes, de 6h à 19h UTC (9h à 22h heure de Madagascar)
    - cron: '*/5 6-19 * * *'

concurrency:
  group: wfm-sync-group
  cancel-in-progress: true

jobs:
  # Job 1 : L'injection des données (se déclenche quand vous poussez les fichiers)
  sync:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Injection Script
        env:
          NEON_CONN_STRING: ${{ secrets.NEON_CONN_STRING }}
        run: python transform_inject.py

  # Job 2 : Le Keep-Alive (se déclenche toutes les 10 minutes via le cron)
  keep-alive:
    if: github.event_name == 'schedule'
    runs-on: ubuntu-latest
    steps:
      - name: Ping Vercel API
        run: |
          echo "Réveil de l'API Vercel et Neon..."
          curl -s -o /dev/null -w "Statut HTTP: %{http_code}\n" https://wfm-dashboard-three.vercel.app/api/health
