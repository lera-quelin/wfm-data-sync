name: WFM Sync & Keep Alive

on:
  push:
    branches:
      - main
  workflow_dispatch: # Permet à votre script local de le déclencher
  # schedule:
    # Toutes les 5 minutes, de 5h à 20h UTC (8h à 23h heure de Madagascar)
    # - cron: '*/5 5-20 * * *'

concurrency:
  group: wfm-sync-group
  cancel-in-progress: false

jobs:
  # =========================================================
  # Job 1 : L'injection des données 
  # (Se déclenche quand le script local pousse les données ou manuellement)
  # =========================================================
  sync:
    if: github.event_name != 'schedule' # Ne pas lancer l'injection pendant les pings du cron
    runs-on: ubuntu-latest
    steps:
      - name: 1. Checkout du code public (le script Python)
        uses: actions/checkout@v4

      - name: 2. Checkout des données privées (data_extractions)
        uses: actions/checkout@v4
        with:
          repository: lera-quelin/data_extractions
          token: ${{ secrets.PRIVATE_REPO_TOKEN }}
          path: ./data_extractions

      - name: 3. Configuration de Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 4. Installation des dépendances Python
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: 5. Exécution du script d'injection (transform_inject.py)
        env:
          NEON_CONN_STRING: ${{ secrets.NEON_CONN_STRING }}
        run: python transform_inject.py

  # =========================================================
  # Job 2 : Le Keep-Alive 
  # (Garde Vercel et Neon éveillés, se déclenche uniquement via le cron)
  # =========================================================
  keep-alive:
    if: github.event_name == 'schedule'
    runs-on: ubuntu-latest
    steps:
      - name: Ping de l'API Vercel
        run: |
          echo "Réveil de l'API Vercel et Neon..."
          curl -s -o /dev/null -w "Statut HTTP: %{http_code}\n" https://wfm-dashboard-three.vercel.app/api/health
