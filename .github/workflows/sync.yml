name: Sync WFM Data to Neon

on:
  push:
    branches:
      - main

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Injection Script
        env:
          NEON_CONN_STRING: ${{ secrets.NEON_CONN_STRING }}
        run: python transform_inject.py
